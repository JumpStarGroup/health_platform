<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    html { background: #ffffff; }
    body {
      width: 720pt;
      height: 405pt;
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #0B3A5C;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    h1 {
      margin: 0;
      font-size: 44pt;
      color: #FFFFFF;
      letter-spacing: 0.5pt;
    }
    h2 {
      margin: 14pt 0 0 0;
      font-size: 22pt;
      color: #CFE9F3;
      font-weight: normal;
    }
    .meta {
      margin-top: 34pt;
      font-size: 14pt;
      color: #B9D6E3;
      text-align: center;
      line-height: 1.35;
    }
    .meta p {
      margin: 0;
    }
    .badge {
      margin-top: 14pt;
      padding: 8pt 18pt;
      background: #4ECDC4;
      border-radius: 18pt;
      color: #073041;
      font-size: 14pt;
      font-weight: bold;
    }
    .badge p {
      margin: 0;
    }
    .accent {
      width: 360pt;
      height: 3pt;
      background: #FF6B6B;
      margin: 20pt 0 0 0;
      border-radius: 4pt;
    }
  </style>
</head>
<body>
  <h1>健康记录平台</h1>
  <h2>全量功能清单与近期变化报告</h2>
  <div class="accent"></div>
  <div class="meta">
    <p>报告日期：2026-01-23</p>
    <p>范围：2026-01-08 ~ 2026-01-23</p>
  </div>
  <div class="badge"><p>当前版本：v1.1.0</p></div>
</body>
</html>
