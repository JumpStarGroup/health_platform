<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    html { background: #ffffff; }
    body {
      width: 720pt;
      height: 405pt;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      font-family: Arial, Helvetica, sans-serif;
      background: #F7FAFC;
    }
    .header {
      height: 64pt;
      background: #1C5C8E;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 44pt;
    }
    .header h2 {
      margin: 0;
      font-size: 20pt;
      color: #FFFFFF;
    }
    .header p {
      margin: 0;
      font-size: 12pt;
      color: #D7E8F6;
    }
    .content {
      flex: 1;
      display: flex;
      gap: 18pt;
      padding: 28pt 44pt 28pt 44pt;
    }
    .left {
      flex: 1.15;
      display: flex;
      flex-direction: column;
      gap: 12pt;
    }
    .card {
      background: #FFFFFF;
      border: 1pt solid #E5E7EB;
      border-radius: 14pt;
      padding: 14pt 16pt;
      box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.06);
    }
    .card h3 {
      margin: 0;
      font-size: 14pt;
      color: #374151;
    }
    .card p {
      margin: 8pt 0 0 0;
      font-size: 12pt;
      color: #4B5563;
      line-height: 1.35;
    }
    .right {
      flex: 0.85;
      display: flex;
      flex-direction: column;
      gap: 10pt;
    }
    .shot {
      background: #FFFFFF;
      border: 1pt solid #E5E7EB;
      border-radius: 14pt;
      padding: 10pt;
      box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.06);
    }
    img {
      width: 100%;
      height: 212pt;
      object-fit: cover;
      border-radius: 10pt;
    }
    .imgPlaceholder {
      width: 100%;
      height: 212pt;
      border-radius: 10pt;
      background: #F8FAFC;
      display:flex;
      align-items:center;
      justify-content:center;
      color:#9CA3AF;
      font-size:12pt;
    }
    .imgPlaceholder p { margin: 0; }
    .caption {
      margin: 8pt 0 0 0;
      font-size: 10.5pt;
      color: #6B7280;
    }
  </style>
</head>
<body>
  <div class="header">
    <h2>近期变化（业务视角）</h2>
    <p>v1.1.0 · 2026-01-23</p>
  </div>

  <div class="content">
    <div class="left">
      <div class="card">
        <h3>1) 数据录入效率提升</h3>
        <p>引入“健康记录批量导入（预览→提交）”，面向历史数据迁移与集中补录场景，减少手工录入成本。</p>
      </div>
      <div class="card">
        <h3>2) 数据质量与可靠性增强</h3>
        <p>完善血压/心率/时间校验、重复记录防护、导入错误报告下载，降低脏数据影响。</p>
      </div>
      <div class="card">
        <h3>3) 交付稳定性提升</h3>
        <p>E2E 回归测试稳定可复现，并沉淀为自动化工作流与报告资产，提升发版效率与可控性。</p>
      </div>
    </div>

    <div class="right">
      <div class="shot">
        <div class="imgPlaceholder"><p>CI/CD 截图（已移除以便生成）</p></div>
        <p class="caption">CI/CD 交付链路与自动化能力沉淀（示意）</p>
      </div>
    </div>
  </div>
</body>
</html>
