<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g transform="translate(40,40)" font-family="Arial, Helvetica, sans-serif">
    <text x="0" y="0" font-size="20" font-weight="700" fill="#0f172a">CI/CD 指标（示意）</text>
    <!-- bars -->
    <g transform="translate(0,24)">
      <g transform="translate(0,0)">
        <text x="0" y="24" font-size="12" fill="#374151">Unit Tests</text>
        <rect x="120" y="6" width="420" height="18" rx="6" fill="#E6EEF6"/>
        <rect x="120" y="6" width="360" height="18" rx="6" fill="#4ECDC4"/>
        <text x="560" y="20" font-size="12" fill="#374151">85%</text>
      </g>
      <g transform="translate(0,36)">
        <text x="0" y="24" font-size="12" fill="#374151">E2E Pass Rate</text>
        <rect x="120" y="6" width="420" height="18" rx="6" fill="#FEEFEF"/>
        <rect x="120" y="6" width="300" height="18" rx="6" fill="#FFB86B"/>
        <text x="560" y="20" font-size="12" fill="#374151">71%</text>
      </g>
      <g transform="translate(0,72)">
        <text x="0" y="24" font-size="12" fill="#374151">Deployment Success</text>
        <rect x="120" y="6" width="420" height="18" rx="6" fill="#EEF8F8"/>
        <rect x="120" y="6" width="396" height="18" rx="6" fill="#2C7A7B"/>
        <text x="560" y="20" font-size="12" fill="#374151">94%</text>
      </g>
    </g>
    <g transform="translate(0,160)">
      <text x="0" y="0" font-size="13" fill="#334155">说明：图中数值为示意，表示测试覆盖与交付稳定性趋势。</text>
    </g>
