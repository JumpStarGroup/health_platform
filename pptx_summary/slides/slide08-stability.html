<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html { background: #EAF3FF; }
  body {
    width: 720pt; height: 405pt; margin: 0; padding: 0;
    background: #EAF3FF; font-family: Arial, sans-serif; color: #0B1F3A;
    display: flex;
  }
  .content { padding: 32pt 48pt; width: 100%; }
  .title { font-size: 24pt; margin: 0 0 12pt 0; }
  .panel {
    background: #FFFFFF; border-radius: 10pt; padding: 16pt;
    border: 2pt solid #BFD4F2; min-height: 260pt;
  }
  h3 { font-size: 13pt; margin: 0 0 8pt 0; color: #1F5FBF; }
  ul { margin: 0; padding-left: 16pt; }
  li { font-size: 11.5pt; margin-bottom: 6pt; }
</style>
</head>
<body>
  <div class="content">
    <p class="title">稳定性修复：重复记录防护</p>
    <div class="panel">
      <h3>修复关键点</h3>
      <ul>
        <li>重复检测前置到 Service 层，避免写入后再校验</li>
        <li>同成员同一分钟记录被拒绝或在导入中跳过</li>
        <li>导入结果统计包含 skipped_count 与明细</li>
      </ul>
      <h3>验证结果</h3>
      <ul>
        <li>手动重复创建被正确拦截</li>
        <li>重复导入文件全部进入跳过列表</li>
        <li>分钟边界 / 不同成员场景均通过</li>
        <li>提供历史重复数据清理工具与流程</li>
      </ul>
    </div>
  </div>
</body>
</html>
