<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html { background: #EAF3FF; }
  body {
    width: 720pt; height: 405pt; margin: 0; padding: 0;
    background: #EAF3FF; font-family: Arial, sans-serif; color: #0B1F3A;
    display: flex;
  }
  .content { padding: 36pt 48pt; width: 100%; }
  .title { font-size: 24pt; margin: 0 0 12pt 0; }
  .subtitle { font-size: 12pt; color: #2D6FBF; margin: 0 0 18pt 0; }
  .panel {
    background: #FFFFFF; border-radius: 10pt; padding: 18pt;
    border: 2pt solid #BFD4F2; min-height: 250pt;
  }
  ul { margin: 0; padding-left: 18pt; }
  li { font-size: 12pt; margin-bottom: 10pt; }
  .highlight { color: #1F5FBF; font-weight: bold; }
</style>
</head>
<body>
  <div class="content">
    <p class="title">家庭成员（Phase A）</p>
    <p class="subtitle">简化版多成员档案能力</p>
    <div class="panel">
      <ul>
        <li>每个用户默认拥有家庭组与 <span class="highlight">Self/本人</span> 成员</li>
        <li>成员为健康档案，不具备登录能力</li>
        <li>成员可增删改（软删除保留历史）</li>
        <li>健康记录可指定 <span class="highlight">subject_member_id</span> 归属</li>
        <li>列表与报表可按成员维度筛选展示</li>
      </ul>
    </div>
  </div>
</body>
</html>
