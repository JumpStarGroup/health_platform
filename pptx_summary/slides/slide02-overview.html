<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html { background: #EAF3FF; }
  body {
    width: 720pt; height: 405pt; margin: 0; padding: 0;
    background: #EAF3FF; font-family: Arial, sans-serif; color: #0B1F3A;
    display: flex;
  }
  .content { padding: 36pt 48pt; width: 100%; }
  .title { font-size: 24pt; margin: 0 0 16pt 0; }
  .subtitle { font-size: 12pt; color: #2D6FBF; margin: 0 0 20pt 0; }
  .grid { display: flex; gap: 18pt; }
  .card {
    flex: 1; background: #FFFFFF; border-radius: 10pt; padding: 16pt;
    border: 2pt solid #BFD4F2; min-height: 220pt;
  }
  h3 { font-size: 14pt; margin: 0 0 10pt 0; color: #1F5FBF; }
  ul { margin: 0; padding-left: 16pt; }
  li { font-size: 12pt; margin-bottom: 8pt; }
</style>
</head>
<body>
  <div class="content">
    <p class="title">项目目标与范围</p>
    <p class="subtitle">基于 MVP 需求与实施计划的交付范围总结</p>
    <div class="grid">
      <div class="card">
        <h3>核心目标</h3>
        <ul>
          <li>多用户健康指标记录与管理</li>
          <li>血压/心率趋势可视化与下载</li>
          <li>标签与时间维度筛选</li>
          <li>家庭成员场景的记录归属</li>
        </ul>
      </div>
      <div class="card">
        <h3>交付范围</h3>
        <ul>
          <li>用户认证与个人资料管理</li>
          <li>健康记录 CRUD 与校验</li>
          <li>仪表盘与报表图表</li>
          <li>响应式 UI 与基础安全</li>
        </ul>
      </div>
      <div class="card">
        <h3>基础约束</h3>
        <ul>
          <li>JWT 鉴权、限流、CORS</li>
          <li>数据按用户隔离</li>
          <li>范围校验与错误提示</li>
          <li>可扩展到导出/分享</li>
        </ul>
      </div>
    </div>
  </div>
</body>
</html>
