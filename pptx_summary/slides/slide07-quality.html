<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html { background: #EAF3FF; }
  body {
    width: 720pt; height: 405pt; margin: 0; padding: 0;
    background: #EAF3FF; font-family: Arial, sans-serif; color: #0B1F3A;
    display: flex;
  }
  .content { padding: 32pt 48pt; width: 100%; }
  .title { font-size: 24pt; margin: 0 0 14pt 0; }
  .grid { display: flex; gap: 18pt; }
  .card {
    flex: 1; background: #FFFFFF; border-radius: 10pt; padding: 14pt;
    border: 2pt solid #BFD4F2; min-height: 240pt;
  }
  h3 { font-size: 13pt; margin: 0 0 8pt 0; color: #1F5FBF; }
  ul { margin: 0; padding-left: 16pt; }
  li { font-size: 11.5pt; margin-bottom: 6pt; }
</style>
</head>
<body>
  <div class="content">
    <p class="title">质量与测试覆盖</p>
    <div class="grid">
      <div class="card">
        <h3>批量导入测试</h3>
        <ul>
          <li>单元测试 22/22 通过</li>
          <li>模板下载 / 错误日志覆盖</li>
          <li>回归测试 15 个用例通过</li>
          <li>手动场景 10 项全覆盖</li>
        </ul>
      </div>
      <div class="card">
        <h3>阈值配置测试</h3>
        <ul>
          <li>新增 9 项三层校验测试</li>
          <li>异常优先级与边界值覆盖</li>
          <li>总测试数累计 52 项通过</li>
          <li>无回归问题</li>
        </ul>
      </div>
      <div class="card">
        <h3>非功能性验证</h3>
        <ul>
          <li>导入性能：1000 条 &lt; 10 秒</li>
          <li>响应式适配：移动 / 桌面</li>
          <li>安全：JWT、限流、CORS</li>
          <li>数据库一致性与错误处理</li>
        </ul>
      </div>
    </div>
  </div>
</body>
</html>
