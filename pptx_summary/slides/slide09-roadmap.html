<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html { background: #EAF3FF; }
  body {
    width: 720pt; height: 405pt; margin: 0; padding: 0;
    background: #EAF3FF; font-family: Arial, sans-serif; color: #0B1F3A;
    display: flex;
  }
  .content { padding: 32pt 48pt; width: 100%; }
  .title { font-size: 24pt; margin: 0 0 12pt 0; }
  .row { display: flex; gap: 18pt; }
  .card {
    flex: 1; background: #FFFFFF; border-radius: 10pt; padding: 14pt;
    border: 2pt solid #BFD4F2; min-height: 240pt;
  }
  h3 { font-size: 13pt; margin: 0 0 8pt 0; color: #1F5FBF; }
  ul { margin: 0; padding-left: 16pt; }
  li { font-size: 11.5pt; margin-bottom: 6pt; }
</style>
</head>
<body>
  <div class="content">
    <p class="title">后续路线（规划/草稿）</p>
    <div class="row">
      <div class="card">
        <h3>数据与分享</h3>
        <ul>
          <li>CSV 导出与分享链接</li>
          <li>导入历史与报告管理</li>
          <li>异步导入与进度反馈</li>
          <li>更多数据源接入</li>
        </ul>
      </div>
      <div class="card">
        <h3>阈值与仪表盘</h3>
        <ul>
          <li>仪表盘阈值参考卡片</li>
          <li>趋势图动态阈值颜色</li>
          <li>完整 E2E 回归路径</li>
          <li>状态统计与可解释性</li>
        </ul>
      </div>
      <div class="card">
        <h3>运营与版本</h3>
        <ul>
          <li>管理员后台与重置密码</li>
          <li>版本号与变更日志展示</li>
          <li>更严格的审计与权限</li>
          <li>安全与合规增强</li>
        </ul>
      </div>
    </div>
  </div>
</body>
</html>
