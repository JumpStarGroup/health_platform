<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    html { background: #ffffff; }
    body {
      width: 720pt;
      height: 405pt;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      font-family: Arial, Helvetica, sans-serif;
      background: #F7FAFC;
    }
    .header {
      height: 64pt;
      background: #1C5C8E;
      display: flex;
      align-items: center;
      padding: 0 44pt;
    }
    .header h2 {
      margin: 0;
      font-size: 20pt;
      color: #FFFFFF;
    }
    .wrap {
      flex: 1;
      display: flex;
      gap: 18pt;
      padding: 26pt 44pt 24pt 44pt;
    }
    .panel {
      flex: 1;
      background: #FFFFFF;
      border: 1pt solid #E5E7EB;
      border-radius: 14pt;
      padding: 16pt 18pt;
      box-shadow: 2px 2px 10px rgba(0,0,0,0.06);
    }
    h3 {
      margin: 0;
      font-size: 14pt;
      color: #277884;
    }
    ul {
      margin: 12pt 0 0 18pt;
      padding: 0;
      font-size: 13pt;
      color: #374151;
      line-height: 1.35;
    }
    li { margin: 6pt 0; }
    p {
      margin: 12pt 0 0 0;
      font-size: 11pt;
      color: #6B7280;
    }
  </style>
</head>
<body>
  <div class="header">
    <h2>测试与质量</h2>
  </div>

  <div class="wrap">
    <div class="panel">
      <h3>E2E 运行方式优化</h3>
      <ul>
        <li>部署后 E2E：禁用 web server（更贴近 deployed 环境）</li>
        <li>Playwright 配置调整，减少 CI 环境依赖与不稳定因素</li>
      </ul>
      <p>相关文件：tests/e2e/playwright.config.js</p>
    </div>
    <div class="panel">
      <h3>稳定性增强</h3>
      <ul>
        <li>成员切换逻辑增强，降低回归流程中的 flaky</li>
        <li>与工作流结合：缺失结果不致失败，但仍保留排查空间</li>
      </ul>
      <p>相关文件：tests/e2e/utils/members.js</p>
    </div>
  </div>
</body>
</html>
