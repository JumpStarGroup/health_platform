<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    html { background: #ffffff; }
    body {
      width: 720pt;
      height: 405pt;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      font-family: Arial, Helvetica, sans-serif;
      background: #F7FAFC;
    }
    .header {
      height: 64pt;
      background: #1C5C8E;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 44pt;
    }
    .header h2 {
      margin: 0;
      font-size: 20pt;
      color: #FFFFFF;
    }
    .header p {
      margin: 0;
      font-size: 12pt;
      color: #D7E8F6;
    }
    .grid {
      flex: 1;
      display: flex;
      gap: 16pt;
      padding: 28pt 44pt 26pt 44pt;
    }
    .card {
      flex: 1;
      background: #FFFFFF;
      border: 1pt solid #E5E7EB;
      border-radius: 14pt;
      padding: 18pt 18pt;
      box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.06);
    }
    .card h3 {
      margin: 0;
      font-size: 14pt;
      color: #374151;
    }
    .num {
      margin: 10pt 0 0 0;
      font-size: 34pt;
      color: #277884;
      font-weight: bold;
    }
    .note {
      margin: 6pt 0 0 0;
      font-size: 11pt;
      color: #6B7280;
    }
    .footer {
      padding: 0 44pt 20pt 44pt;
    }
    .footer p {
      margin: 0;
      font-size: 12pt;
      color: #4B5563;
    }
  </style>
</head>
<body>
  <div class="header">
    <h2>本周概览（提交维度）</h2>
    <p>统计口径：git log --since 2026-01-15</p>
  </div>

  <div class="grid">
    <div class="card">
      <h3>Commits</h3>
      <p class="num">9</p>
      <p class="note">以 workflow / docs / tests 为主</p>
    </div>
    <div class="card">
      <h3>Files touched</h3>
      <p class="num">40</p>
      <p class="note">覆盖 CI、测试、文档与报告素材</p>
    </div>
    <div class="card">
      <h3>Insertions</h3>
      <p class="num">4346</p>
      <p class="note">新增月报与 PPT/HTML 幻灯片资产占比高</p>
    </div>
    <div class="card">
      <h3>Deletions</h3>
      <p class="num">45</p>
      <p class="note">以工作流与测试逻辑微调为主</p>
    </div>
  </div>

  <div class="footer">
    <p>本周重点：工作流稳定性增强、部署后 E2E 可运行性提升、报告与演示素材沉淀。</p>
  </div>
</body>
</html>
