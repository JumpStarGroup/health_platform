<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    html { background: #ffffff; }
    body {
      width: 720pt;
      height: 405pt;
      margin: 0;
      padding: 0;
      display: flex;
      font-family: Arial, Helvetica, sans-serif;
      background: #F7FAFC;
    }
    .leftBand {
      width: 110pt;
      height: 405pt;
      background: #1C5C8E;
    }
    .content {
      flex: 1;
      margin: 42pt 44pt 40pt 44pt;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    h1 {
      margin: 0;
      font-size: 40pt;
      color: #1F2937;
      line-height: 1.05;
    }
    h2 {
      margin: 10pt 0 0 0;
      font-size: 18pt;
      color: #277884;
      font-weight: bold;
    }
    p {
      margin: 16pt 0 0 0;
      font-size: 13pt;
      color: #4B5563;
    }
    .meta {
      margin-top: 26pt;
      display: flex;
      gap: 16pt;
    }
    .pill {
      border-radius: 18pt;
      background: #E6F4F1;
      border: 1pt solid #C8ECE6;
      padding: 10pt 14pt;
    }
    .pill p {
      margin: 0;
      font-size: 12pt;
      color: #1F2937;
    }
  </style>
</head>
<body>
  <div class="leftBand"></div>
  <div class="content">
    <h1>健康记录平台</h1>
    <h2>周报 · 2026-01-22</h2>
    <p>时间范围：2026-01-15 ~ 2026-01-22</p>
    <div class="meta">
      <div class="pill"><p>主题：CI/CD 稳定性 · 报告资产 · E2E 优化</p></div>
      <div class="pill"><p>分支：feature/workshop0108</p></div>
    </div>
  </div>
</body>
</html>
