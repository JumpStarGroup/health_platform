# Manual E2E regression test workflow.

name: E2E Regression Test

on:
  workflow_dispatch:
    inputs:
      headless:
        description: 'Run tests in headless mode'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      base_url:
        description: 'Frontend base URL'
        required: false
        default: 'http://localhost:3000'
        type: string

permissions:
  contents: read

concurrency:
  group: e2e-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start backend server
        run: |
          export PYTHONPATH=.
          nohup python -m flask --app src.app run --host=0.0.0.0 --port=5000 > backend.log 2>&1 &
          echo $! > backend.pid
          sleep 5
          curl -f http://localhost:5000/api/v1/health || (cat backend.log && exit 1)
        env:
          FLASK_ENV: development
          DATABASE_URL: sqlite:///instance/test_regression.db

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Install E2E dependencies
        working-directory: ./tests/e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: ./tests/e2e
        run: npx playwright install --with-deps chromium

      - name: Run E2E regression test
        working-directory: ./tests/e2e
        run: |
          if [ "${{ inputs.headless }}" = "false" ]; then
            export HEADLESS=false
          fi
          npx playwright test tests/regression-user-journey-cn.spec.js --reporter=html,list
        env:
          E2E_BASE_URL: ${{ inputs.base_url }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/e2e/playwright-report/
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: tests/e2e/test-results/
          retention-days: 7

      - name: Stop backend server
        if: always()
        run: |
          if [ -f backend.pid ]; then
            kill $(cat backend.pid) || true
          fi

      - name: Display backend logs
        if: failure()
        run: |
          echo "=== Backend Logs ==="
          cat backend.log || echo "No backend log found"
