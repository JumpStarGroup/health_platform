<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
  <rect width="100%" height="100%" fill="#f8fafc"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#0f172a">
    <g transform="translate(60,60)">
      <rect x="0" y="0" width="240" height="80" rx="12" fill="#ffffff" stroke="#e6eef6"/>
      <text x="20" y="30" font-size="18" font-weight="700">Upload CSV</text>
      <text x="20" y="54" font-size="14" fill="#374151">模板与文件上传</text>

      <path d="M260 40 L340 40" stroke="#9CA3AF" stroke-width="3" marker-end="url(#arrow)"/>

      <rect x="360" y="0" width="240" height="80" rx="12" fill="#ffffff" stroke="#e6eef6"/>
      <text x="380" y="30" font-size="18" font-weight="700">Preview</text>
      <text x="380" y="54" font-size="14" fill="#374151">预览校验</text>

      <path d="M620 40 L700 40" stroke="#9CA3AF" stroke-width="3" marker-end="url(#arrow)"/>

      <rect x="720" y="0" width="200" height="80" rx="12" fill="#ffffff" stroke="#e6eef6"/>
      <text x="740" y="30" font-size="18" font-weight="700">Commit</text>
      <text x="740" y="54" font-size="14" fill="#374151">写入数据库</text>

      <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 0 L 10 5 L 0 10 z" fill="#9CA3AF" />
        </marker>
      </defs>

      <g transform="translate(0,120)">
        <rect x="0" y="0" width="940" height="120" rx="8" fill="#ffffff" stroke="#e6eef6"/>
        <text x="16" y="28" font-size="14" font-weight="700">校验规则示例</text>
        <text x="16" y="56" font-size="13" fill="#334155">• 血压 30–250，收缩压 &gt; 舒张压</text>
        <text x="16" y="78" font-size="13" fill="#334155">• 心率（可选）30–150</text>
        <text x="320" y="56" font-size="13" fill="#334155">• 重复记录按成员+时间去重</text>
        <text x="320" y="78" font-size="13" fill="#334155">• 错误行可导出报告</text>
      </g>
    </g>
  </g>
</svg>