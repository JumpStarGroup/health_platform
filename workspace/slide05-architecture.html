<!DOCTYPE html>
<html>
<head>
<style>
html { background: #ffffff; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #F7F9FA; font-family: Arial, sans-serif;
  display: flex;
}
.header {
  position: absolute; top: 0; left: 0; right: 0;
  background: #1C5C8E; padding: 20pt 40pt;
}
.header h2 {
  color: #ffffff; font-size: 32pt; margin: 0;
}
.content {
  margin: 100pt 40pt 50pt 40pt; width: 640pt;
  display: flex; gap: 20pt;
}
.text-col {
  flex: 0 0 260pt;
}
.text-col h3 {
  color: #1C5C8E; font-size: 17pt; margin: 0 0 12pt 0;
}
.stack-item {
  background: #ffffff; padding: 10pt; border-radius: 6pt;
  margin-bottom: 8pt; border-left: 4pt solid #4ECDC4;
}
.stack-item p {
  margin: 0; font-size: 10pt;
}
.stack-item .label {
  color: #1C5C8E; font-weight: bold; margin-bottom: 3pt;
}
.chart-col {
  flex: 1;
}
.placeholder {
  background: #E8F4F8; border: 2pt dashed #4ECDC4;
  border-radius: 8pt; height: 245pt; display: flex;
  align-items: center; justify-content: center;
}
.placeholder p {
  color: #1C5C8E; font-size: 14pt; margin: 0;
}
</style>
</head>
<body>
<div class="header">
  <h2>系统架构</h2>
</div>
<div class="content">
  <div class="text-col">
    <h3>技术栈</h3>
    <div class="stack-item">
      <p class="label">前端</p>
      <p>React 18 + Ant Design 5</p>
    </div>
    <div class="stack-item">
      <p class="label">后端</p>
      <p>Flask 3.0 + SQLAlchemy</p>
    </div>
    <div class="stack-item">
      <p class="label">数据库</p>
      <p>SQLite / MySQL</p>
    </div>
    <div class="stack-item">
      <p class="label">部署</p>
      <p>Docker + Kubernetes</p>
    </div>
  </div>
  <div class="chart-col">
    <div id="arch-chart" class="placeholder">
      <p>架构图</p>
    </div>
  </div>
</div>
</body>
</html>
