<!DOCTYPE html>
<html>
<head>
<style>
html { background: #ffffff; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #1C5C8E;
  font-family: Arial, sans-serif;
  display: flex; flex-direction: column;
  justify-content: center; align-items: center;
}
h1 {
  color: #ffffff; font-size: 48pt; font-weight: bold;
  margin: 0 0 20pt 0; text-align: center;
}
.subtitle {
  color: #E8F4F8; font-size: 18pt; margin: 0 0 40pt 0;
  text-align: center;
}
.stats {
  display: flex; gap: 30pt; margin-bottom: 40pt;
}
.stat-box {
  background: rgba(255, 255, 255, 0.15); padding: 20pt 30pt;
  border-radius: 12pt; text-align: center;
  backdrop-filter: blur(10pt);
}
.stat-box .number {
  color: #FFFFFF; font-size: 36pt; font-weight: bold;
  margin: 0 0 5pt 0;
}
.stat-box .label {
  color: #E8F4F8; font-size: 13pt; margin: 0;
}
.footer {
  color: #B8E6E1; font-size: 14pt; text-align: center;
}
</style>
</head>
<body>
<h1>谢谢！</h1>
<p class="subtitle">感谢所有为健康记录平台贡献的团队成员</p>
<div class="stats">
  <div class="stat-box">
    <p class="number">15K</p>
    <p class="label">代码行数</p>
  </div>
  <div class="stat-box">
    <p class="number">85%</p>
    <p class="label">测试覆盖率</p>
  </div>
  <div class="stat-box">
    <p class="number">25+</p>
    <p class="label">API 端点</p>
  </div>
</div>
<p class="footer">Generated by Copilot · 健康记录平台 v1.1.0</p>
</body>
</html>
